name: banuba_arcloud
description: Banuba AR Cloud for Flutter. Load and update Banuba Face AR effects from the cloud at runtime, so apps can add or change AR effects without shipping a new build.
version: 1.0.6
homepage: 'https://docs.banuba.com/'

topics:
  - augmented-reality
  - ar-effects
  - cloud
  - sdk

environment:
  sdk: '>=2.18.5 <4.0.0'
  flutter: '^1.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.banuba.sdk.flutter.arcloud
        pluginClass: FlutterARCloudPlugin
      ios:
        pluginClass: FlutterARCloudPlugin
